name: Refresh libs

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      rev:
        description: "Seashell commit sha (blank = latest on main)"
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.v.outputs.rev }}
      short: ${{ steps.v.outputs.short }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          WANT: ${{ inputs.rev }}
          EVENT: ${{ github.event_name }}
        run: |
          current="$(sed -nE 's/^#define SEASHELL_UPSTREAM_REV[[:space:]]+"([^"]+)"/\1/p' include/seashell.h)"
          latest="$(git ls-remote https://github.com/soundsonacid/seashell HEAD | cut -f1)"
          rev="${WANT:-$latest}"
          echo "current=$current latest=$latest target=$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "short=${rev:0:7}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ] || [ "$rev" != "$current" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-15,         platform: darwin-arm64 }
          - { os: macos-15-intel,   platform: darwin-x64 }
    steps:
      - uses: actions/checkout@v5
      - name: Bump to Seashell ${{ needs.check.outputs.short }}
        run: etc/scripts/bump.sh "${{ needs.check.outputs.rev }}"
      - run: make lib test
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.platform }}
          path: libs/${{ matrix.platform }}/libseashell.a
          if-no-files-found: error

  pr:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - run: etc/scripts/bump.sh "${{ needs.check.outputs.rev }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: artifacts
      - name: Place archives
        run: |
          for d in artifacts/lib-*; do
            platform="${d#artifacts/lib-}"
            mkdir -p "libs/$platform"
            cp "$d/libseashell.a" "libs/$platform/libseashell.a"
          done
          rm -rf artifacts
          ls -lh libs/*/libseashell.a
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/seashell-${{ needs.check.outputs.short }}
          commit-message: "chore: rebuild libs for seashell ${{ needs.check.outputs.short }}"
          title: "Rebuild libs for seashell ${{ needs.check.outputs.short }}"
          body: |
            Automated by `refresh.yml`: Cargo.lock seeded from Seashell's
            lockfile at ${{ needs.check.outputs.rev }}, archives rebuilt and
            smoke-tested on native runners for every platform in `libs/`.

            Bump `SEASHELL_CXX_VERSION` / `Cargo.toml` and tag after merging
            if this should ship as a release.
