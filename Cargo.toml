[package]
name = "seashell-cxx"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "C ABI for Seashell"
publish = false

[lib]
name = "seashell"
crate-type = ["staticlib", "cdylib"]

[dependencies]
bincode = "1.3.3"
seashell-core = { package = "seashell", git = "https://github.com/soundsonacid/seashell", rev = "e36678069bfc0a89850ff7c7f686bbf430d97b92" }
openssl = { version = "0.10.81", features = ["vendored"] }
serde = "1"
solana-account = "4.3.1"
solana-clock = "3.1.1"
solana-instruction = "3.4.0"
solana-instruction-error = { version = "2.4.0", features = ["serde"] }
solana-keypair = "3.1.2"
solana-logger = "2.3.1"
solana-program-error = "3.0.1"
solana-pubkey = { version = "4.2.0", features = ["curve25519"] }
solana-signer = "3.0.1"
solana-svm-log-collector = { version = "=4.3.0-alpha.3", features = ["agave-unstable-api"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
opt-level = "s"

[profile.dev]
panic = "unwind"
